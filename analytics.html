{% extends "base.html" %}{% block title %}Analytics | MachGuard{% endblock %}
{% block content %}<div class="page"><div class="pagehead"><span class="eyebrow">DATA INTELLIGENCE</span><h1>Analytics</h1><p>Machine health and operating condition overview.</p></div><section class="panel chartpanel"><canvas id="healthChart"></canvas></section><section class="cards">{% for m in machines %}<div><span>{{m.name}}</span><b>{{m.health}}%</b><small>{{m.risk}} risk · {{m.temperature}}°C</small></div>{% endfor %}</section></div><script>fetch("{{url_for('api_health')}}").then(r=>r.json()).then(d=>new Chart(document.getElementById("healthChart"),{type:"bar",data:{labels:d.map(x=>x.name),datasets:[{label:"Health Score",data:d.map(x=>x.health)}]},options:{responsive:true,scales:{y:{beginAtZero:true,max:100}}}}));</script>{% endblock %}
